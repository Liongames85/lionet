name: Publish LIOnet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_STATIC_MODE: true
      VITE_BASE_PATH: /lionet/
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skonfiguruj pnpm
        run: corepack enable && corepack prepare pnpm@10.18.0 --activate
      - name: Zainstaluj zależności
        run: pnpm install --frozen-lockfile
      - name: Zbuduj LIOnet
        run: pnpm run build && node work/prepare-pages.mjs
      - name: Przygotuj Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
